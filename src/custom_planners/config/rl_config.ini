# RL Training Configuration File
# Adjust these parameters for different training scenarios

[DQN Agent]
state_size = 15
action_size = 5
learning_rate = 0.0005
gamma = 0.99
epsilon = 1.0
epsilon_decay = 0.995
epsilon_min = 0.01
batch_size = 32
hidden_size = 128
replay_buffer_capacity = 5000
target_network_update_freq = 100

[Environment]
max_steps_per_episode = 200
max_distance_to_goal = 5.0
goal_threshold = 0.3
collision_threshold = 0.25

[Training]
num_episodes = 100
eval_frequency = 10
save_frequency = 50
checkpoint_dir = ./checkpoints_dqn

[Q-Learning Alternative]
state_bins = [5, 5, 5, 5, 5]
learning_rate = 0.1
gamma = 0.99
epsilon = 1.0
epsilon_decay = 0.995
epsilon_min = 0.01

[Reward Function]
# Base reward for getting closer to goal
distance_progress_reward = 1.0

# Penalty for collision
collision_penalty = -10.0

# Bonus for reaching goal
goal_bonus = 50.0

# Small penalty for each step (encourages efficiency)
step_penalty = -0.01

[Performance Benchmarking]
test_trials = 3
test_goals = [(1.0, 1.0), (2.0, -1.0), (-1.5, 1.5), (2.5, 2.5)]
max_test_time = 60
algorithms = ['astar', 'dijkstra', 'greedy']

[Simulation Parameters]
robot_model = burger
world_file = labyrinthe.world
gazebo_gui = true
rviz_enabled = true
